<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163b66">
  <meta name="description" content="Generador aleatorio de letras españolas y números del 0 al 500.">
  <link rel="manifest" href="manifest.json">
  <title>Letras y Números Aleatorios</title>
  <style>
    :root { --navy:#163b66; --blue:#1d70a2; --pale:#edf5fb; --gold:#f4a261; --ink:#142333; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:linear-gradient(160deg,#edf5fb,#fff 70%); }
    main { width:min(720px,100%); margin:0 auto; padding:24px 18px calc(24px + env(safe-area-inset-bottom)); }
    header { text-align:center; margin:8px 0 22px; }
    h1 { color:var(--navy); font-size:clamp(1.6rem,5vw,2.25rem); margin:0 0 8px; }
    header p { margin:0; color:#506274; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .tab { border:2px solid var(--navy); border-radius:14px; padding:13px 10px; font-size:1rem; font-weight:700; background:#fff; color:var(--navy); cursor:pointer; }
    .tab.active { background:var(--navy); color:white; }
    .card { background:white; border-radius:24px; padding:22px 18px; box-shadow:0 12px 32px #163b6614; border:1px solid #dce8f2; text-align:center; }
    .label { text-transform:uppercase; letter-spacing:.12em; font-size:.78rem; font-weight:800; color:#617589; }
    .result { display:flex; align-items:center; justify-content:center; min-height:220px; color:var(--navy); font-size:clamp(6rem,27vw,11rem); line-height:1; font-weight:850; letter-spacing:-.04em; overflow-wrap:anywhere; }
    .result.number { font-size:clamp(5rem,22vw,9rem); }
    .counter { color:#52677b; font-size:.95rem; margin:2px 0 18px; }
    .primary { width:100%; border:0; border-radius:16px; padding:17px 14px; background:var(--blue); color:white; font-size:1.1rem; font-weight:800; cursor:pointer; box-shadow:0 5px 0 #145477; }
    .primary:active { transform:translateY(2px); box-shadow:0 3px 0 #145477; }
    .secondary { border:1px solid #c6d5e3; background:#f7fafc; color:var(--navy); border-radius:12px; padding:11px 14px; font-weight:700; cursor:pointer; }
    .controls { display:flex; justify-content:center; margin-top:13px; }
    .note { font-size:.88rem; line-height:1.5; color:#5d6f80; margin:18px 4px 0; text-align:center; }
    .hidden { display:none; }
    button:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Letras y Números</h1>
    <p>Generador aleatorio para jugar, practicar o sortear.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Tipo de resultado">
    <button class="tab active" id="lettersTab" role="tab" aria-selected="true">Letras A–Z</button>
    <button class="tab" id="numbersTab" role="tab" aria-selected="false">Números 0–500</button>
  </div>
  <section class="card" aria-live="polite">
    <div class="label" id="resultLabel">Tu letra</div>
    <div class="result" id="result">A</div>
    <div class="counter" id="counter">0 de 27 letras utilizadas</div>
    <button class="primary" id="drawButton">Nueva letra</button>
    <div class="controls"><button class="secondary" id="resetButton">Reiniciar secuencia</button></div>
  </section>
  <p class="note" id="note">Las letras no se repiten hasta que hayan salido las 27 letras del alfabeto español, incluida la Ñ.</p>
</main>
<script>
(() => {
  const alphabet = [..."ABCDEFGHIJKLMNÑOPQRSTUVWXYZ"];
  const numbers = Array.from({length: 501}, (_, i) => i);
  let mode = "letters";
  let letterPool = [];
  let numberPool = [];
  let lastLetter = null;
  let lastNumber = null;
  const result = document.getElementById("result");
  const counter = document.getElementById("counter");
  const label = document.getElementById("resultLabel");
  const drawButton = document.getElementById("drawButton");
  const note = document.getElementById("note");
  const lettersTab = document.getElementById("lettersTab");
  const numbersTab = document.getElementById("numbersTab");

  function shuffledCopy(items) {
    const a = [...items];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function refillLetters() {
    letterPool = shuffledCopy(alphabet);
    // Avoid an identical letter at the boundary between cycles when possible.
    if (letterPool.length > 1 && letterPool[letterPool.length - 1] === lastLetter) {
      [letterPool[0], letterPool[letterPool.length - 1]] = [letterPool[letterPool.length - 1], letterPool[0]];
    }
  }
  function refillNumbers() {
    numberPool = shuffledCopy(numbers);
    if (numberPool.length > 1 && numberPool[numberPool.length - 1] === lastNumber) {
      [numberPool[0], numberPool[numberPool.length - 1]] = [numberPool[numberPool.length - 1], numberPool[0]];
    }
  }
  function render() {
    const isLetters = mode === "letters";
    lettersTab.classList.toggle("active", isLetters);
    numbersTab.classList.toggle("active", !isLetters);
    lettersTab.setAttribute("aria-selected", String(isLetters));
    numbersTab.setAttribute("aria-selected", String(!isLetters));
    result.classList.toggle("number", !isLetters);
    label.textContent = isLetters ? "Tu letra" : "Tu número";
    drawButton.textContent = isLetters ? "Nueva letra" : "Nuevo número";
    if (isLetters) {
      counter.textContent = `${alphabet.length - letterPool.length} de ${alphabet.length} letras utilizadas`;
      note.textContent = "Las letras no se repiten hasta que hayan salido las 27 letras del alfabeto español, incluida la Ñ.";
    } else {
      counter.textContent = `${numbers.length - numberPool.length} de ${numbers.length} números utilizados`;
      note.textContent = "Los números no se repiten hasta que hayan salido todos los números del 0 al 500.";
    }
  }
  function draw() {
    if (mode === "letters") {
      if (letterPool.length === 0) refillLetters();
      lastLetter = letterPool.pop();
      result.textContent = lastLetter;
    } else {
      if (numberPool.length === 0) refillNumbers();
      lastNumber = numberPool.pop();
      result.textContent = String(lastNumber);
    }
    render();
  }
  function reset() {
    letterPool = [];
    numberPool = [];
    lastLetter = null;
    lastNumber = null;
    result.textContent = "—";
    render();
  }
  lettersTab.addEventListener("click", () => { mode = "letters"; render(); });
  numbersTab.addEventListener("click", () => { mode = "numbers"; render(); });
  drawButton.addEventListener("click", draw);
  resetButton.addEventListener("click", reset);
  result.textContent = "—";
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
